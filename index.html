<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Security</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#C42100',
            'light-red': '#FFCCC4',
          },
          fontFamily: {
            ubuntu: ['Ubuntu', 'sans-serif'],
            redhat: ['Red Hat Display', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base {
      html,
      body {
        @apply m-0 w-full max-w-full overflow-x-hidden font-ubuntu;
      }

      #app {
        @apply w-full max-w-full overflow-x-hidden;
      }
    }
    @layer components {
      .btn-primary {
        @apply inline-flex items-center justify-center px-8 py-3 bg-[#C42100] text-white font-bold rounded-md text-lg shadow-xl uppercase tracking-wider transition-all duration-300;
      }
      .btn-primary:hover {
        @apply bg-[#a01b00] shadow-2xl scale-105;
      }
    }
  </style>
</head>
<body class="font-ubuntu">
  <div id="app"></div>
  <script type="module" src="/src/page/main.js"></script>
</body>
</html>
